name: resistance_tables
description: Parse Sierra-local HIV drug resistance JSON and codfreq files into mutation and resistance CSV tables
keywords:
  - hiv
  - drug resistance
  - sierra-local
  - codfreq
  - mutation
tools:
  - resistance_tables:
      description: |
        Custom script that combines Sierra-local HIV drug resistance JSON reports
        with codfreq tables to generate tables for mutation and drug resistance.
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - json:
        type: file
        description: Sierra-local JSON report
        pattern: "*.{json}"
        ontologies:
          - edam: http://edamontology.org/format_3464
    - codfreq:
        type: file
        description: Codon frequency file
        pattern: "*.{codfreq,csv}"
        ontologies:
          - edam: http://edamontology.org/format_3752
output:
  mutation_csv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_mutation_table.csv":
          type: file
          description: CSV table containing mutations with codfreq-derived allele frequencies and coverage
          pattern: "*_mutation_table.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752
  mutation_short_csv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_mutation_table_short.csv":
          type: file
          description: Mutations shortenned CSV file
          pattern: "*_mutation_table_short.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752
  resistance_csv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - "*_resistance_table.csv":
          type: file
          description: CSV table containing drug resistance interpretation from Sierra-local
          pattern: "*_resistance_table.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The tool name
      - python --version | sed "s/Python //g":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The tool name
      - python --version | sed "s/Python //g":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@svarona"
  - "@LilyAnderssonLee"
maintainers:
  - "@svarona"
  - "@LilyAnderssonLee"
