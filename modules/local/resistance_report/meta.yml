name: resistance_report
description: Generate an HTML HIV drug resistance report from Sierra-local, mutation, resistance, Nextclade, consensus, and annotation files
keywords:
  - hiv
  - drug resistance
  - report
  - html
  - sierra-local
tools:
  - resistance_report:
      description: |
        Custom nf-core/viralrecon script that renders an HTML HIV drug resistance report
        from per-sample Sierra-local JSON reports, mutation and resistance CSV tables,
        Nextclade subtype reports, consensus FASTA files, and GFF annotations.
      licence: ["MIT"]
      identifier: ""
input:
  - sierralocal_json:
      type: file
      description: Sierra-local JSON reports staged into the sierralocal_json folder
      pattern: "*_resistance.json"
      ontologies:
        - edam: http://edamontology.org/format_3464
  - mutation_csv:
      type: file
      description: Mutation CSV tables generated by RESISTANCE_TABLES
      pattern: "*_mutation_table.csv"
      ontologies:
        - edam: http://edamontology.org/format_3752
  - resistance_csv:
      type: file
      description: Resistance CSV tables generated by RESISTANCE_TABLES
      pattern: "*_resistance_table.csv"
      ontologies:
        - edam: http://edamontology.org/format_3752
  - nextclade_csv:
      type: file
      description: Nextclade CSV reports used to include subtype information
      pattern: "*.csv"
      ontologies:
        - edam: http://edamontology.org/format_3752
  - consensus:
      type: file
      description: Consensus FASTA files included in the report
      pattern: "*.{fa,fasta}"
      ontologies:
        - edam: http://edamontology.org/format_1929
  - annotation:
      type: file
      description: GFF annotation files used to extract protein sequences for genes of interest
      pattern: "*.{gff,gff3}"
      ontologies:
        - edam: http://edamontology.org/format_1975
output:
  mutation_csv:
    - "*.html":
        type: file
        description: HTML HIV drug resistance report
        pattern: "*.html"
        ontologies:
          - edam: http://edamontology.org/format_2331
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The tool name
      - python --version | sed "s/Python //g":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The tool name
      - python --version | sed "s/Python //g":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@svarona"

maintainers:
  - "@svarona"
  - "@LilyAnderssonLee"
