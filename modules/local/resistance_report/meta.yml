name: resistance_report
description: Generate an HTML HIV drug resistance report from one sample's Sierra-local JSON report, mutation and resistance CSV tables, Nextclade subtype report, consensus FASTA file.
keywords:
  - hiv
  - drug resistance
  - report
  - html
  - sierra-local
tools:
  - resistance_report:
      description: |
        Custom nf-core/viralrecon script that renders an HTML HIV drug resistance report
        from per-sample Sierra-local JSON reports, mutation and resistance CSV tables,
        Nextclade subtype reports, consensus FASTA files.
      licence: ["MIT"]
input:
  - sierralocal_json:
      type: file
      description: Sierra-local JSON report
      pattern: "*_resistance.json"
      ontologies:
        - edam: http://edamontology.org/format_3464
  - mutation_csv:
      type: file
      description: Mutation CSV table generated by RESISTANCE_TABLES
      pattern: "*_mutation_table.csv"
      ontologies:
        - edam: http://edamontology.org/format_3752
  - resistance_csv:
      type: file
      description: Resistance CSV table generated by RESISTANCE_TABLES
      pattern: "*_resistance_table.csv"
      ontologies:
        - edam: http://edamontology.org/format_3752
  - nextclade_csv:
      type: file
      description: Nextclade CSV report used to include subtype information
      pattern: "*.csv"
      ontologies:
        - edam: http://edamontology.org/format_3752
  - consensus:
      type: file
      description: Consensus FASTA file included in the report
      pattern: "*.{fa,fasta}"
      ontologies:
        - edam: http://edamontology.org/format_1929
  - nextclade_dataset_name:
      type: string
      description: Nextclade dataset name used for subtype and QC annotation
  - nextclade_dataset_tag:
      type: string
      description: Nextclade dataset tag used for subtype and QC annotation
output:
  html:
    - "*.html":
        type: file
        description: HTML HIV drug resistance report
        pattern: "*.html"
        ontologies:
          - edam: http://edamontology.org/format_2331
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The tool name
      - python --version | sed "s/Python //g":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The tool name
      - python --version | sed "s/Python //g":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@svarona"
  - "@LilyAnderssonLee"

maintainers:
  - "@svarona"
  - "@LilyAnderssonLee"
